name: Release
on:
  release:
    types:
      - published
jobs:
  publish:
    name: Publish Gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: "3.4"
      - uses: ./.github/actions/setup-gemfury
        with:
          token: ${{ secrets.GEMFURY_API_TOKEN }}
      - run: bundle exec rake release
